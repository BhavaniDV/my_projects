<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <input type="text" placeholder="your-password" id="in">
       <div class="item"> 
        <label for="number-length">password-length</label>
        <input type="number" min="1" id="number_length">
      </div>
      <div  class="item"> 
        <label for="upperCase">upperCase</label>
        <input type="checkbox" id="upperCase">
      </div>
      <div  class="item"> 
        <label for="lowerCase">lowerCase</label>
        <input type="checkbox" id="lowerCase">
      </div>
      <div  class="item"> 
        <label for="special">special Character</label>
        <input type="checkbox" id="special">
      </div>
      <div  class="item"> 
        <label for="numberCase">Number</label>
        <input type="checkbox" id="numberCase">
      </div>
      <button type="button">generate</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
