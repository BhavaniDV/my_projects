<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>





    <div class="container">
        <div class="uppePart">
            <h2 class="heading">loan calculator</h2>
            <span><label for="amount" class="amount">amount</label>
                <input type="number" class="amount" id="amount"></span>
           <span><label for="prtng" class="prtng">%</label>
            <input type="number" class="prtng" id="prtng"></span> 
           <span><label for="a" class="year">number of year</label>
            <input type="number" class="a" id="a"></span> 
            <button class="claculate">calculate</button>
        </div>
        <div class="lowerPart">
            <h4 class="heading">result</h4>
            <span><label for="mp" class="mp">monthly amount</label>
                <input type="number" class="tm" id="mp"></span>
                <span><label for="tm" class="tm">total amount</label>
                    <input type="number" class="tm" id="tm"></span>
                    <span><label for="ti" class="ti">total intrest</label>
                        <input type="number" class="ti" id="ti"></span>
            </div>
            <button class="close">close</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
